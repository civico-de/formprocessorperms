# CI stack — standalone, not an override of docker-compose.yml. Keep image tag
# and db version in sync with it; :v1 matches the workflow's @v1 pin.
#
#   docker compose -f .docker/docker-compose.ci.yml up -d --wait
#   docker compose -f .docker/docker-compose.ci.yml exec -T -u www-data app bash -c \
#     'cd /var/www/html/ext/formprocessorperms && CIVICRM_UF=UnitTests phpunit --coverage-text tests/phpunit && phpstan analyse'
#
# Unnamed .docker/ stacks all become project "docker" and share volumes across checkouts.
# The marked blocks are template-managed (ckinit --update); repo-specific
# additions such as sibling mounts go between them.
# BEGIN CIVIKITCHEN MANAGED app
name: formprocessorperms-ci

services:
  app:
    image: ${CIVIKITCHEN_IMAGE:-ghcr.io/civico-de/civikitchen:v1}
    pull_policy: always
    depends_on:
      db:
        condition: service_healthy
    # DB connection = image defaults (db / civicrm), matching the db service.
    environment:
      CIVICRM_AUTO_INSTALL: "1"
      CIVIKITCHEN_SITE_URL: "http://localhost:8080"
      # The profile seeds as admin, the user the e2e suites log in with.
      CIVIKITCHEN_DEMO_USER: admin
      CIVIKITCHEN_PROFILE: dev
      CIVIKITCHEN_PROFILE_PATH: /civikitchen-profiles
      CIVIKITCHEN_TRUST_EXTERNAL_PROFILES: "1"
    volumes:
      # Mounted under ext/ → enabled on first boot, <requires> resolved.
      - ..:/var/www/html/ext/formprocessorperms
      - ./profiles:/civikitchen-profiles:ro
      - ./init.d:/civikitchen-init.d:ro
# END CIVIKITCHEN MANAGED app
    # tests/e2e/e2e-http-standalone.sh drives the real authx/REST path over HTTP.
    ports:
      - "8080:80"

# BEGIN CIVIKITCHEN MANAGED db
  db:
    image: mariadb:11.4
    # Civi\Test's schema rebuild creates triggers as the app user; with binary
    # logging the server refuses that unless it trusts non-SUPER creators.
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: civicrm
      MYSQL_USER: civicrm
      MYSQL_PASSWORD: civicrm
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
# END CIVIKITCHEN MANAGED db
