# Dev stack: `cd .docker && docker compose up -d` (first boot installs + provisions;
# `down -v` re-provisions). CiviCRM :8080 (admin/admin), maildev :1080, phpMyAdmin :8081.

# Unnamed .docker/ stacks all become project "docker" and share volumes across checkouts.
name: formprocessorperms

services:
  app:
    image: ${CIVIKITCHEN_IMAGE:-ghcr.io/jfilter/civikitchen:v1}
    # :v1 matches the @v1 CI pin; CIVIKITCHEN_IMAGE pins a CiviCRM minor (e.g.
    # civikitchen:standalone-6.15). Always pull so a stale layer cannot mask fixes.
    pull_policy: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      CIVICRM_AUTO_INSTALL: "1"
      CIVICRM_DB_HOST: db
      CIVICRM_DB_NAME: civicrm
      CIVICRM_DB_USER: civicrm
      CIVICRM_DB_PASSWORD: civicrm
      # Must match the host:port opened in the browser (asset URLs).
      CIVIKITCHEN_SITE_URL: "http://localhost:8080"
      CIVIKITCHEN_DEMO_USER: admin
      # Outbound mail lands in maildev.
      CIVIKITCHEN_SMTP_HOST: maildev
      CIVIKITCHEN_SMTP_PORT: "1025"
      # Comma-separated; optional sibling extensions go here, not into info.xml.
      # The <requires> (form-processor, action-provider) are installed by the entrypoint.
      CIVIKITCHEN_ENABLE_EXTENSIONS: "formprocessorperms"
    volumes:
      - ..:/var/www/html/ext/formprocessorperms
      # Sibling example: - ../../othersibling:/var/www/html/ext/othersibling
      # First-boot hooks, run after install + ext:enable in lexical order (init.d/README.md).
      - ./init.d:/civikitchen-init.d:ro

  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: civicrm
      MYSQL_USER: civicrm
      MYSQL_PASSWORD: civicrm
    volumes:
      - db-data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  maildev:
    image: maildev/maildev:2.1.0
    ports:
      - "1080:1080"
      - "1025:1025"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2.2
    depends_on:
      - db
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db

volumes:
  db-data:
