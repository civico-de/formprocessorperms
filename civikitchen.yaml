$schema: https://raw.githubusercontent.com/jfilter/civikitchen/main/packages/civikitchen-scenario-schema/scenario.schema.json
version: 1
policy:
  # Expected values for ckconform (the checker lives in the public civikitchen
  # image; these values are ours and stay in this private repo).
  license: Proprietary
  npm_license: UNLICENSED
  copyright: 'civico GmbH'

  # Measured 2026-08-04 (ckcoverage, standalone CI stack): 83.33% (20/24
  # statements) — the permission hook including its table-absent and
  # query-failure paths; the uncovered rest is the civix config/install/enable
  # trio. Ratchet up as it gains tests, never down.
  coverage:
    minimum: 80

  # Two template files this repo deviates on.
  #
  # The CI stack needs action-provider + form-processor downloaded before the
  # extension is enabled (the hook reads form_processor's table), and it
  # publishes port 80 because tests/e2e/e2e-http-standalone.sh drives the real
  # authx/REST path over HTTP.
  #
  # lib.sh is the host-side E2E helper (docker compose exec, maildev): this
  # repo's suites run INSIDE the container via `cv scr` / bash, where its cv()
  # wrapper would shadow the real cv.
  template_custom:
    paths:
      - tests/e2e/lib.sh
    reason: 'the e2e suites run inside the container, so the host-side lib.sh helpers are dead code there'

  # Business hooks live in scan classes (AutoSubscriber/HookInterface); the
  # classic function form is reserved for pre-boot/lifecycle/return-value hooks.
  hook_style: listener
  renovate_preset: github>civico-de/renovate
